# アプリのビルド・デプロイ（Cloud Run）とインフラの apply（Terraform）。
# ブランチで環境を切り替える: develop → dev（sunabalog-dev） / main → prod（sunabalog-prod）
#   - ui ジョブ   : apps/ui/** の変更で Cloud Run Service を deploy
#   - infra ジョブ: infra/** または apps/automator/** の変更で terraform apply
#   - realtime ジョブ: apps/realtime/** の変更で収録ルームの Cloudflare Worker を wrangler deploy（#166）
# ローカルからの手動 apply は `make terraform-deploy-<env>`、
# PR プレビューは pr-preview.yml が担当する。
name: cd

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "apps/ui/**"
      - "apps/automator/**"
      - "infra/**"
      - "apps/realtime/**"
      - ".github/workflows/cd.yml"
      # 手順書などドキュメントのみの変更で apply を走らせない（#125）。
      # 除外は後方のパターンが勝つため、必ず positive の後ろに置くこと。
      - "!infra/docs/**"
  # automator の手動 plan/apply 用（push でも apps/automator/** 変更時に自動デプロイする）
  workflow_dispatch:
    inputs:
      target_branch:
        description: "automator: deploy 対象ブランチ"
        required: true
        default: "develop"
        type: string
      deploy_mode:
        description: "automator: Terraform 操作"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
      deploy_ui:
        description: "ui: イメージを再ビルドして Cloud Run へデプロイする"
        required: false
        default: false
        type: boolean

concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-northeast1

jobs:
  # 変更パスに応じて ui / infra を出し分ける
  changes:
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      infra: ${{ steps.filter.outputs.infra }}
      realtime: ${{ steps.filter.outputs.realtime }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # base 未指定だと「リポジトリ既定ブランチ(main)との全差分」が比較対象になり、
          # develop への push では main に先行している全コミットが含まれてフィルタが
          # 実質無効化される（#127）。push されたブランチと同じ ref を渡すと
          # 「push 直前のコミットとの比較」になる。
          # workflow_dispatch では空文字＝既定動作に委ねる（infra ジョブは
          # github.event_name == 'workflow_dispatch' で短絡評価され、ui ジョブは
          # push を要求するため、dispatch 時にこの結果は使われない）。
          base: ${{ github.event_name == 'push' && github.ref_name || '' }}
          filters: |
            ui:
              - 'apps/ui/**'
              - '.github/workflows/cd.yml'
            # dorny/paths-filter は各パターンを OR で評価するため '!' は除外にならない
            # （'!infra/docs/**' が「infra/docs 以外の全ファイル」に一致してしまう）。
            # ドキュメントのみの変更は上の on.push.paths 側で弾く。
            infra:
              - 'infra/**'
              - 'apps/automator/**'
            realtime:
              - 'apps/realtime/**'
              - '.github/workflows/cd.yml'

  # ui のビルド・デプロイ。push で apps/ui/** が変わったとき、または
  # workflow_dispatch で deploy_ui = true を指定したとき。
  # 手動起動を用意しているのは、コード変更なしにイメージを再ビルド・再配信したい
  # ケースがあるため（Artifact Registry を作り直してイメージが消えた等）。
  ui:
    needs: changes
    if: |
      (github.event_name == 'push' && needs.changes.outputs.ui == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_ui)
    runs-on: ubuntu-latest
    steps:
      - name: Resolve environment
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            REF="refs/heads/${{ inputs.target_branch }}"
          else
            REF="${GITHUB_REF}"
          fi
          echo "TARGET_REF=$REF" >> "$GITHUB_ENV"
          if [[ "$REF" == "refs/heads/main" ]]; then
            {
              echo "ENVIRONMENT=prod"
              echo "PROJECT_ID=sunabalog-prod"
              echo "SERVICE=sparkcast-ui-prod"
              echo "IMAGE=asia-northeast1-docker.pkg.dev/sunabalog-prod/sparkcast-ui/sparkcast-ui"
              echo "WORKLOAD_IDENTITY_PROVIDER=projects/697315992056/locations/global/workloadIdentityPools/github-actions/providers/github-oidc"
              echo "DEPLOYER_SA=github-actions-deployer@sunabalog-prod.iam.gserviceaccount.com"
              echo "DATABASE_URL_SECRET=supabase-database-url-prod"
              echo "NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyCOe16OGUrP1qWtJTKlatf5gbuKRdiLDg8"
              echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=sunabalog-prod.firebaseapp.com"
              echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=sunabalog-prod"
              echo "FIREBASE_AUTH_HELPER_DOMAIN=sunabalog-prod.firebaseapp.com"
              echo "APP_URL=https://sparkcast.sunabalog.com"
            } >> "$GITHUB_ENV"
          else
            {
              echo "ENVIRONMENT=dev"
              echo "PROJECT_ID=sunabalog-dev"
              echo "SERVICE=sparkcast-ui-dev"
              echo "IMAGE=asia-northeast1-docker.pkg.dev/sunabalog-dev/sparkcast-ui/sparkcast-ui"
              echo "WORKLOAD_IDENTITY_PROVIDER=projects/452347646684/locations/global/workloadIdentityPools/github-actions/providers/github-oidc"
              echo "DEPLOYER_SA=github-actions-deployer@sunabalog-dev.iam.gserviceaccount.com"
              echo "DATABASE_URL_SECRET=supabase-database-url-dev"
              echo "NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyCBsZ7_ZC0fin7XpPxgborVu_73zUidJkI"
              echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=sunabalog-dev.firebaseapp.com"
              echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=sunabalog-dev"
              echo "FIREBASE_AUTH_HELPER_DOMAIN=sunabalog-dev.firebaseapp.com"
              echo "APP_URL=https://dev.sparkcast.sunabalog.com"
            } >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # 新しいコードを配信する前に DB スキーマを収束させる。
      # 接続先はアプリ（Cloud Run）と同じ Supabase の DATABASE_URL secret（#90 / #120）。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run migrations
        working-directory: apps/ui
        run: |
          npm ci
          DATABASE_URL="$(gcloud secrets versions access latest --secret="$DATABASE_URL_SECRET" --project="$PROJECT_ID")"
          # 接続文字列はパスワードを含むため、以降のログ出力をマスクする。
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          npm run db:migrate

      - name: Build image
        working-directory: apps/ui
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="$NEXT_PUBLIC_FIREBASE_API_KEY" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="$NEXT_PUBLIC_FIREBASE_PROJECT_ID" \
            --build-arg FIREBASE_AUTH_HELPER_DOMAIN="$FIREBASE_AUTH_HELPER_DOMAIN" \
            -t "$IMAGE:${{ github.sha }}" .

      - name: Push image
        run: docker push "$IMAGE:${{ github.sha }}"

      # プレビューの --no-traffic 運用でトラフィックが特定リビジョンに固定されると
      # 通常の deploy では最新へ移らないため、自リビジョンへ明示的に 100% を振る。
      - name: Deploy to Cloud Run
        run: |
          SUFFIX="sha-${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}"
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE:${{ github.sha }}" \
            --revision-suffix "$SUFFIX" \
            --no-traffic
          gcloud run services update-traffic "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --to-revisions "${SERVICE}-${SUFFIX}=100"

      - name: Notify Discord
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_ACTIONS_WEBHOOK_URL }}
          title: "${{ env.SERVICE }} deploy (${{ env.ENVIRONMENT }})"
          description: "${{ env.APP_URL }}"
          username: GitHub Actions

  # Terraform デプロイ（push で infra/** または apps/automator/** 変更時、または手動 dispatch）。
  # 統合後の単一 infra/ を apply する（ui の Cloud Run 基盤 + automator の Job/GCS/SQL 等）。
  # apps/automator/** も対象にするのは app イメージ変更時に local-exec の再ビルド・push が要るため。
  # 認証は WIF（キーレス）。共有 SA github-actions-deployer を impersonate する。
  infra:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve environment
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            REF="refs/heads/${{ inputs.target_branch }}"
          else
            REF="${GITHUB_REF}"
          fi
          echo "TARGET_REF=$REF" >> "$GITHUB_ENV"
          if [[ "$REF" == "refs/heads/main" ]]; then
            {
              echo "ENVIRONMENT=prod"
              echo "WORKLOAD_IDENTITY_PROVIDER=projects/697315992056/locations/global/workloadIdentityPools/github-actions/providers/github-oidc"
              echo "DEPLOYER_SA=github-actions-deployer@sunabalog-prod.iam.gserviceaccount.com"
            } >> "$GITHUB_ENV"
          else
            {
              echo "ENVIRONMENT=dev"
              echo "WORKLOAD_IDENTITY_PROVIDER=projects/452347646684/locations/global/workloadIdentityPools/github-actions/providers/github-oidc"
              echo "DEPLOYER_SA=github-actions-deployer@sunabalog-dev.iam.gserviceaccount.com"
            } >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v2

      # Terraform の local-exec が行う app イメージの push（Artifact Registry）用に、
      # ホスト側 docker の認証を通す（terraform はホスト docker ソケットを使う）。
      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # 統合後は Terraform をリポジトリルートの Makefile（infra/ 一元管理）から実行する。
      # .env はルートに置く（root Makefile が -include .env / --env-file .env で参照）。
      - name: Prepare .env
        run: |
          cat > .env <<EOF
          CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_api_token=${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCESS_KEY_ID=${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          CLOUDFLARE_SECRET_ACCESS_KEY=${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
          EOF

      # WIF の access_token を渡す。GCS backend / google provider とも env を直接読む。
      - name: Deploy
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          MODE="apply"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.deploy_mode }}"
          fi
          if [[ "$MODE" == "plan" ]]; then
            make terraform-base ENVIRONMENT="${ENVIRONMENT}" COMMAND="plan -no-color"
          else
            make terraform-base ENVIRONMENT="${ENVIRONMENT}" COMMAND="apply -auto-approve"
          fi

      - name: Notify Discord
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_ACTIONS_WEBHOOK_URL }}
          title: "infra deploy (${{ env.ENVIRONMENT }})"
          username: GitHub Actions

  # 収録ルームの Cloudflare Worker（apps/realtime、#166）。
  # R2 バケットや secret は infra（Terraform）が作るため、infra の後に走らせる。
  # secret は Terraform が Secret Manager に置いた JSON を wrangler secret bulk で入れる。
  # prod は電気通信事業の届出が済むまで出さない（リポジトリ変数 RECORDING_PROD_ENABLED=true で解禁）。
  realtime:
    needs: [changes, infra]
    if: |
      always() &&
      needs.infra.result != 'failure' && needs.infra.result != 'cancelled' &&
      github.event_name == 'push' && needs.changes.outputs.realtime == 'true' &&
      (github.ref_name != 'main' || vars.RECORDING_PROD_ENABLED == 'true')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8ed20f6872cea7c9219d68bfcf5f98ae
    defaults:
      run:
        working-directory: apps/realtime
    steps:
      - name: Resolve environment
        working-directory: .
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            {
              echo "ENVIRONMENT=prod"
              echo "PROJECT_ID=sunabalog-prod"
              echo "WORKLOAD_IDENTITY_PROVIDER=projects/697315992056/locations/global/workloadIdentityPools/github-actions/providers/github-oidc"
              echo "DEPLOYER_SA=github-actions-deployer@sunabalog-prod.iam.gserviceaccount.com"
            } >> "$GITHUB_ENV"
          else
            {
              echo "ENVIRONMENT=dev"
              echo "PROJECT_ID=sunabalog-dev"
              echo "WORKLOAD_IDENTITY_PROVIDER=projects/452347646684/locations/global/workloadIdentityPools/github-actions/providers/github-oidc"
              echo "DEPLOYER_SA=github-actions-deployer@sunabalog-dev.iam.gserviceaccount.com"
            } >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/realtime/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy worker
        run: npx wrangler deploy --env "$ENVIRONMENT"

      - name: Put worker secrets
        run: |
          SECRETS_FILE="$(mktemp)"
          trap 'rm -f "$SECRETS_FILE"' EXIT
          gcloud secrets versions access latest \
            --secret=sparkcast-recording-worker-secrets \
            --project="$PROJECT_ID" > "$SECRETS_FILE"
          npx wrangler secret bulk "$SECRETS_FILE" --env "$ENVIRONMENT"

      - name: Notify Discord
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_ACTIONS_WEBHOOK_URL }}
          title: "realtime worker deploy (${{ env.ENVIRONMENT }})"
          username: GitHub Actions
